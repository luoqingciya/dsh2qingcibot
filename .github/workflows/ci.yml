name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qingci-plugin-sdk @ git+https://github.com/Qingci-Bot/Plugins-SDK.git@v1.13.9"
          pip install pytest pytest-asyncio ruff mypy

      - name: 代码风格
        run: |
          ruff check .
          ruff format --check .

      - name: 类型检查
        run: |
          mypy --ignore-missing-imports \
            __init__.py config.py state.py diary.py memory.py emotion.py \
            persona.py commands.py companion.py proactive.py

      - name: 单元测试
        run: pytest -q
